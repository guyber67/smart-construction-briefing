name: Weekly Smart Construction Briefing

on:
  schedule:
    # Sunday 21:07 UTC = Monday 06:07 KST
    - cron: "7 21 * * 0"
    # Sunday 22:07 UTC = Monday 07:07 KST backup
    - cron: "7 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Two API stages can each wait through the full 30/90/180-second retry policy.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKIP_IF_TODAY_EXISTS: ${{ github.event_name == 'schedule' }}
        run: python scripts/generate_briefing.py

      - name: Commit updated briefing
        shell: bash
        run: |
          if git diff --quiet -- data/briefings.json; then
            echo "No briefing changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/briefings.json
          TODAY=$(TZ=Asia/Seoul date +%F)
          git commit -m "Update weekly briefing ${TODAY}"
          git push
