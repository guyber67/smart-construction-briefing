name: Daily Smart Construction Briefing

on:
  schedule:
    # 21:00 UTC = 06:00 KST (next calendar day in Korea)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Commit updated briefing
        shell: bash
        run: |
          if git diff --quiet -- data/briefings.json; then
            echo "No briefing changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/briefings.json
          TODAY=$(TZ=Asia/Seoul date +%F)
          git commit -m "Update daily briefing ${TODAY}"
          git push
